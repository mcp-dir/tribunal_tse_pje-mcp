# Smithery configuration for Tribunal TSE: Processo Judicial Eletrônico (PJe)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tribunal_tse_pje

name: tribunal_tse_pje-mcp
displayName: "Tribunal TSE: Processo Judicial Eletrônico (PJe)"
description: >
  Tribunal TSE: Processo Judicial Eletrônico (PJe), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tribunal_tse_pje-mcp
repository: https://github.com/mcp-dir/tribunal_tse_pje-mcp

tags:
  - tribunal_tse_pje
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tribunal_tse_pje

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tribunal_tse_pje/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
